<div
  class="pointer-events-none fixed inset-x-0 bottom-0 z-[70] flex flex-col items-center gap-2 p-4 sm:items-end"
>
  @for (toast of toasts(); track toast.id) {
    <div
      role="status"
      aria-live="polite"
      class="toast-enter pointer-events-auto flex w-full max-w-sm items-start gap-3 rounded-xl border px-4 py-3 shadow-lg shadow-emerald-950/50 backdrop-blur"
      [class.border-emerald-500/40]="toast.type === 'success'"
      [class.bg-emerald-950/90]="toast.type === 'success'"
      [class.text-emerald-100]="toast.type === 'success'"
      [class.border-red-500/40]="toast.type === 'error'"
      [class.bg-red-950/90]="toast.type === 'error'"
      [class.text-red-100]="toast.type === 'error'"
      [class.border-slate-600/50]="toast.type === 'info'"
      [class.bg-slate-900/90]="toast.type === 'info'"
      [class.text-slate-100]="toast.type === 'info'"
    >
      @switch (toast.type) {
        @case ('success') {
          <span
            class="mt-0.5 flex h-5 w-5 shrink-0 items-center justify-center rounded-full bg-emerald-500/20 text-emerald-300"
            aria-hidden="true"
          >
            <svg
              class="h-3.5 w-3.5"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.4"
            >
              <path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12.75l6 6 9-13.5" />
            </svg>
          </span>
        }
        @case ('error') {
          <span
            class="mt-0.5 flex h-5 w-5 shrink-0 items-center justify-center rounded-full bg-red-500/20 text-red-300"
            aria-hidden="true"
          >
            <svg
              class="h-3.5 w-3.5"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.4"
            >
              <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
            </svg>
          </span>
        }
        @default {
          <span
            class="mt-0.5 flex h-5 w-5 shrink-0 items-center justify-center rounded-full bg-slate-500/20 text-slate-300"
            aria-hidden="true"
          >
            <svg
              class="h-3.5 w-3.5"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M11.25 11.25l.041-.02a.75.75 0 011.063.852l-.708 2.836a.75.75 0 001.063.853l.041-.021M21 12a9 9 0 11-18 0 9 9 0 0118 0zm-9-3.75h.008v.008H12V8.25z"
              />
            </svg>
          </span>
        }
      }

      <p class="flex-1 text-sm font-medium">{{ toast.message }}</p>

      <button
        type="button"
        (click)="dismiss(toast.id)"
        [attr.aria-label]="'Fermer la notification'"
        class="rounded-md p-1 text-current opacity-60 transition hover:opacity-100"
      >
        <svg
          class="h-4 w-4"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          aria-hidden="true"
        >
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </div>
  }
</div>
